<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rookery - Chess opening courses</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="header"></div>
<main class="wrap">
<h1>Chess opening courses</h1>
<p class="sub">20 common openings, with the main lines to learn for each. Pick one and play through it.</p>
<div class="tools">
  <input type="search" id="q" placeholder="Search openings..." aria-label="Search openings">
  <span class="seg">
    <button data-f="all" class="on">All</button>
    <button data-f="white">White</button>
    <button data-f="black">Black</button>
  </span>
</div>
<div class="grid" id="grid"></div>
<p class="empty" id="none" hidden>Nothing matches that search.</p>
</main>
<div id="footer"></div>
<script type="module" src="/js/layout.js"></script>
<script type="module" src="/js/home.js"></script>
</body>
</html>
